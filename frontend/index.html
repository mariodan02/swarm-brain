<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swarm Brain</title>
  <link rel="stylesheet" href="style.css">
  <!-- Texts are Italian here and replaced at start-up in the page's language (i18n.js). -->
  <!-- Three.js as ES modules from a pinned CDN version: no build step needed. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div class="fx"></div>

    <header id="top">
      <div class="brand">
        <h1>SWARM<span>BRAIN</span></h1>
        <span class="sub">multi-agent cortex monitor</span>
      </div>
      <button id="why" type="button">perché un cervello?</button>
      <a id="llm-link" href="llm/">dentro un LLM →</a>
      <a id="lang-switch" href="?lang=en" data-router-ignore>EN</a>
      <div id="mode" class="badge" hidden>SIMULATED</div>
      <div class="stats">
        <div class="stat"><span class="k">T+</span><span id="timer" class="v">00:00.0</span></div>
        <div class="stat"><span class="k">LLM</span><span id="calls" class="v">0</span></div>
        <div class="stat"><span class="k">TOK</span><span id="tokens" class="v">0</span></div>
      </div>
    </header>

    <aside id="agents" class="panel">
      <div class="ptitle">agents/</div>
      <ul id="agent-list"></ul>
    </aside>

    <section id="info" class="panel" hidden>
      <div class="ptitle">
        <span id="info-title"></span>
        <button id="info-close" type="button" aria-label="Chiudi">×</button>
      </div>
      <div id="info-body"></div>
    </section>

    <aside id="log" class="panel">
      <div class="ptitle">
        <span>events.log <span id="log-count">0</span></span>
        <button id="log-toggle" type="button" aria-expanded="true" aria-controls="log-list" aria-label="Chiudi o apri il log">▾</button>
      </div>
      <ol id="log-list"></ol>
    </aside>

    <section id="final" class="panel" hidden>
      <div class="ptitle">
        <span id="final-title">result.md</span>
        <button id="final-close" type="button" aria-label="Chiudi">×</button>
      </div>
      <pre id="final-text"></pre>
    </section>

    <div id="ts"></div>

    <!-- onsubmit: a click before main.js has attached its handler must not reload the page -->
    <form id="cmd" class="panel" autocomplete="off" onsubmit="return false">
      <span class="prompt">&gt;</span>
      <input id="goal" type="text" maxlength="400" spellcheck="false"
             placeholder="Scrivi un obiettivo per lo sciame…"
             value="Spiega perché il cielo è blu a un ragazzo di 12 anni">
      <button id="go" type="submit">AVVIA</button>
    </form>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
